name: Publish verified client downloads
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Temporary download grants for already-validated installers
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: public-installer-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check interpreter
        shell: bash
        run: |
          bash --version
          node -e "console.log(process.platform, process.version)"
      - name: Transfer installers and verify SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_MANIFEST: ${{ inputs.manifest }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),{execFileSync}=require('node:child_process');
          (async()=>{
            const repository='youdaoSu/yuanxie-releases';if(process.env.GITHUB_REPOSITORY!==repository)throw Error('Wrong download repository');
            const manifest=JSON.parse(Buffer.from(process.env.TRANSFER_MANIFEST,'base64').toString('utf8'));
            delete process.env.TRANSFER_MANIFEST;
            if(!/^v\d+\.\d+\.\d+$/.test(manifest.tag)||!/^\d+\.\d+\.\d+$/.test(manifest.desktop)||!Number.isSafeInteger(manifest.releaseId))throw Error('Invalid release identity');
            // BEGIN artifact contract: validated locally against desktopReleaseFiles.
            const [major,minor,patch]=manifest.desktop.split('.').map(Number),incremental=major>0||minor>11||minor===11&&patch>=11;
            const linuxPaused=major>0||minor>20||minor===20&&patch>2,linuxFinal=major===0&&minor===20&&patch===2;
            const expected=[`YuanXie-Desktop-${manifest.desktop}-Windows-x64.zip`];
            for(const arch of ['x64','arm64'])for(const [platform,formats] of [['macOS',['zip','dmg']],['Linux',incremental?['zip','tar.gz','deb']:['tar.gz','deb']]]){if(platform==='macOS'&&arch==='x64'&&(major>0||minor>=20)||platform==='Linux'&&(linuxPaused||linuxFinal&&arch==='arm64'))continue;for(const format of formats)expected.push(`YuanXie-Desktop-${manifest.desktop}-${platform}-${arch}.${format}`);}
            const names=expected.flatMap(name=>[name,name+'.sha256',...(incremental&&name.endsWith('.zip')?[name+'.blockmap.json']:[])]);
            // END artifact contract
            if(!Array.isArray(manifest.files)||manifest.files.length!==names.length||new Set(manifest.files.map(file=>file.name)).size!==names.length)throw Error('Incomplete installer set');
            for(const item of manifest.files){const url=new URL(item.url);if(!names.includes(item.name)||url.protocol!=='https:'||url.hostname!=='release-assets.githubusercontent.com'||url.username||url.password||!/^\d{4}-\d{2}-\d{2}T/.test(manifest.createdAt)||!Number.isSafeInteger(item.size)||item.size<1||item.size>400*1024*1024||!/^[a-f0-9]{64}$/.test(item.sha256))throw Error('Invalid installer grant');}
            if(Date.now()-Date.parse(manifest.createdAt)>40*60*1000)throw Error('Installer grants have expired; dispatch a fresh manifest');
            const gh=args=>execFileSync('gh',args,{encoding:'utf8',maxBuffer:4*1024*1024,timeout:600000});
            const read=()=>JSON.parse(gh(['api',`repos/${repository}/releases/${manifest.releaseId}`]));
            const draft=read();if(draft.tag_name!==manifest.tag||!draft.draft||draft.assets.some(asset=>!names.includes(asset.name)))throw Error('Destination must be the expected draft release');
            const parent=fs.realpathSync(process.env.RUNNER_TEMP),temporary=fs.mkdtempSync(path.join(parent,'yuanxie-installers-'));
            try{
              for(const item of manifest.files){
                let asset=read().assets.find(asset=>asset.name===item.name);
                if(!asset){
                  const file=path.join(temporary,item.name),response=await fetch(item.url,{redirect:'error',credentials:'omit',signal:AbortSignal.timeout(600000)});
                  if(response.status!==200||!response.body)throw Error('Installer download failed');
                  const handle=await fs.promises.open(file,'wx'),hash=crypto.createHash('sha256');let received=0;
                  try{for await(const chunk of response.body){received+=chunk.length;if(received>item.size)throw Error('Installer exceeds declared size');hash.update(chunk);await handle.writeFile(chunk);}}finally{await handle.close();}
                  if(received!==item.size||hash.digest('hex')!==item.sha256)throw Error('Installer checksum mismatch');
                  if(item.name.endsWith('.sha256')){const name=item.name.slice(0,-7),original=manifest.files.find(file=>file.name===name);if(fs.readFileSync(file,'utf8').trim()!==original.sha256+'  '+name)throw Error('Invalid checksum sidecar');}
                  gh(['release','upload',manifest.tag,file,'--repo',repository]);asset=read().assets.find(asset=>asset.name===item.name);fs.unlinkSync(file);
                }
                if(!asset||asset.state!=='uploaded'||asset.size!==item.size||asset.digest!=='sha256:'+item.sha256)throw Error('Public upload verification failed: '+item.name);
                console.log('Verified '+item.name);
              }
              if(read().assets.length!==names.length)throw Error('Public release is incomplete');
              console.log('All '+names.length+' installer/checksum/blockmap files verified; release remains draft.');
            }finally{
              if(path.dirname(temporary)!==parent||fs.lstatSync(temporary).isSymbolicLink())throw Error('Unsafe temporary directory');
              for(const name of fs.readdirSync(temporary))if(!names.includes(name)||fs.lstatSync(path.join(temporary,name)).isSymbolicLink())throw Error('Unsafe temporary file');
              fs.rmSync(temporary,{recursive:true});
            }
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
